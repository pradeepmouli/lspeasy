version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: develop
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    # Let a new release age before opening a bump PR. Dependabot PRs run with
    # CI gated (`action_required`) yet still auto-merge, so without this an
    # immature version (< the supply-chain minimumReleaseAge policy, ~24h) can
    # merge un-verified and break the release install — exactly what #162
    # (@skillit/cli 0.6.0) did. The cooldown comfortably clears that window.
    cooldown:
      default-days: 5
      semver-major-days: 7
    groups:
      # Group TypeScript and related packages
      typescript:
        patterns:
          - 'typescript'
          - '@typescript/*'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group testing frameworks
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group code quality tools
      code-quality:
        patterns:
          - 'oxlint'
          - 'oxfmt'
          - 'lint-staged'
        update-types:
          - 'minor'
          - 'patch'
      # Group build tools
      build-tools:
        patterns:
          - 'vite'
          - 'tsx'
          - 'tsconfig'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # apps/docs is deliberately held at typescript 6.x. typedoc 0.28.20
      # declares a `typescript` peer of 5.0.x-6.0.x and reads the compiler's
      # internal AST surface directly; against typescript 7 (the Go-ported
      # native compiler) it dies at load with
      #   TypeError: Cannot read properties of undefined
      #   (reading 'PropertyDeclaration')   [ts4.SyntaxKind.PropertyDeclaration]
      # taking `pnpm run build` down with it. The rest of the workspace stays
      # on 7.x; only the docs app is pinned.
      #
      # Without this rule dependabot re-proposes the major every cycle and
      # auto-merge takes it, silently reverting the pin — that happened twice
      # (#252 undid the fix from #249, and the merge commit had no CI run at
      # all, so it went unnoticed for days).
      #
      # Lift this once typedoc ships a release whose peer range admits
      # typescript 7. Note: aliasing typedoc's own typescript via
      # pnpm-workspace.yaml `packageExtensions` was tried and never took
      # effect — re-pin, don't re-litigate that route.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: develop
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
