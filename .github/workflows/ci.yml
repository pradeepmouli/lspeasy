name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # apps/cli/src/generated is the CLI's entire schema surface at runtime; if
      # it drifts from packages/core/src/protocol the CLI silently ships stale
      # flags, help and examples and nothing else fails.
      #
      # Deliberately NOT `pnpm run generate:protocol`: that chains
      # generate-protocol-types.ts, which calls fetchMetaModel() and downloads
      # the LSP metaModel (the cache lives in the gitignored .cache/, so CI
      # always fetches). That would make this step assert "the committed files
      # match upstream LSP today" — network-dependent, and red whenever the
      # spec changes, for reasons unrelated to the PR under test. Refreshing
      # from upstream stays a deliberate manual `pnpm run update:protocol`.
      #
      # The descriptor generator reads the built core, which the Build step
      # above produced from committed sources, so this is hermetic.
      - name: Verify generated files are current
        run: |
          pnpm tsx scripts/generate-cli-descriptors.ts
          pnpm oxfmt apps/cli/src/generated/*.ts
          git diff --exit-code -- apps/cli/src/generated

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check
        continue-on-error: true
      - name: Test
        run: pnpm run test

      - name: Test Coverage
        run: pnpm run test:coverage
        if: matrix.node-version == '24.x'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
