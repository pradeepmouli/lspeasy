name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The committed files under packages/core/src/protocol and
      # apps/cli/src/generated are the CLI's entire schema surface at runtime.
      # If they drift from the generator, the CLI silently ships stale flags,
      # help and examples — nothing else would fail.
      - name: Verify generated files are current
        run: |
          pnpm run generate:protocol
          git diff --exit-code -- packages/core/src/protocol apps/cli/src/generated

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check
        continue-on-error: true
      - name: Test
        run: pnpm run test

      - name: Test Coverage
        run: pnpm run test:coverage
        if: matrix.node-version == '24.x'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
