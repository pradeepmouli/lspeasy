name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate changeset for runtime dependency updates
        # Dependabot PRs get no changeset, so runtime dependency bumps would never be released
        run: |
          base=$(git log -1 --format=%H --grep='^chore: version packages' HEAD)
          if [ -z "$base" ]; then echo "No previous release commit found; skipping"; exit 0; fi
          q='{d:(.dependencies//{}),o:(.optionalDependencies//{}),p:(.peerDependencies//{})}'
          pkgs=""
          for f in $(git ls-files '*package.json'); do
            case "$f" in *node_modules*) continue;; esac
            [ "$(jq -r '.private // false' "$f")" = "true" ] && continue
            name=$(jq -r '.name // empty' "$f"); [ -z "$name" ] && continue
            old=$(git show "$base:$f" 2>/dev/null | jq -S -c "$q" 2>/dev/null) || continue
            [ -z "$old" ] && continue
            new=$(jq -S -c "$q" "$f")
            [ "$old" != "$new" ] && pkgs="$pkgs $name"
          done
          echo "Release base: ${base:0:7}; packages with runtime dependency changes:${pkgs:- none}"
          if [ -n "$pkgs" ]; then
            { echo '---'; for p in $pkgs; do echo "\"$p\": patch"; done; echo '---'; echo; echo '- chore(deps): update runtime dependencies'; } > ".changeset/deps-runtime-$(date +%s).md"
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        # Pinned to a commit, not `@v2`: v2 is a BRANCH in changesets/action, so
        # it moves. It moved twice under us and broke releases twice — first by
        # renaming these inputs, then by rejecting a GITHUB_TOKEN env var that
        # differs from the github-token input. Neither showed up until a release
        # was attempted, because this workflow only runs on push to master.
        # This SHA is exactly what `v2` pointed at for the 3.0.0 release, so the
        # pin changes nothing today. Dependabot updates it via the version
        # comment.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # The token goes here, NOT in env: the action now errors when a
          # GITHUB_TOKEN env var is set to anything other than this input.
          # Nothing else in the release needs it in the environment — the
          # changelog generator is @changesets/cli/changelog (the default, no
          # GitHub API calls) per .changeset/config.json, and changeset publish
          # authenticates to npm, not GitHub.
          github-token: ${{ secrets.RELEASE_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Enable auto-merge on version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:changeset-release/${context.ref.replace('refs/heads/', '')}`
            });
            if (pulls.length === 0) { console.log('No version PR found'); return; }
            const pr = pulls[0];
            try {
              await github.graphql(`
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                    pullRequest { number }
                  }
                }
              `, { id: pr.node_id });
              console.log(`Auto-merge enabled on PR #${pr.number}`);
            } catch(e) {
              console.log('Auto-merge not available:', e.message);
            }
